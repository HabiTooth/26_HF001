name: Deploy to EC2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # BackendApplicationTests(contextLoads)는 DB가 필요하므로 CI에서는 domain 패키지 단위 테스트만 실행
      - name: Run unit tests
        run: ./gradlew test --tests 'com.habitooth.backend.domain.*'

      - name: Build boot jar
        run: ./gradlew bootJar

      - name: Rename jar
        run: cp build/libs/backend-*.jar backend-new.jar

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend-new.jar
          target: /opt/habitooth/

      - name: Swap jar and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/habitooth
            # 롤백용으로 직전 jar 보관
            if [ -f backend.jar ]; then mv -f backend.jar backend.jar.bak; fi
            mv -f backend-new.jar backend.jar
            sudo systemctl restart habitooth-backend
            sleep 10
            sudo systemctl is-active habitooth-backend || {
              echo "서비스 기동 실패, 최근 로그:";
              sudo journalctl -u habitooth-backend -n 50 --no-pager;
              exit 1;
            }
            echo "배포 완료"
